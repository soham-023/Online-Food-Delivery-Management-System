<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — AnnSeva</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-content">
    <div class="container">
      <h1 class="section-title fade-in">My Orders 📦</h1>
      <p class="section-subtitle mb-3 fade-in">Track and manage your orders</p>

      <!-- Status Filter Tabs -->
      <div class="tabs fade-in stagger-1" id="order-tabs">
        <button class="tab active" onclick="filterOrders('', this)">All</button>
        <button class="tab" onclick="filterOrders('placed', this)">📋 Placed</button>
        <button class="tab" onclick="filterOrders('confirmed', this)">✅ Confirmed</button>
        <button class="tab" onclick="filterOrders('preparing', this)">👨‍🍳 Preparing</button>
        <button class="tab" onclick="filterOrders('out_for_delivery', this)">🛵 On the way</button>
        <button class="tab" onclick="filterOrders('delivered', this)">🎉 Delivered</button>
        <button class="tab" onclick="filterOrders('cancelled', this)">❌ Cancelled</button>
        <button class="tab" onclick="filterScheduled(this)">📅 Scheduled</button>
      </div>

      <div id="orders-list">
        <div class="loader"><div class="spinner"></div></div>
      </div>

      <div class="flex items-center justify-between mt-3" id="orders-pagination" style="display: none;">
        <button class="btn btn-secondary btn-sm" id="orders-prev" onclick="changeOrderPage(-1)">← Prev</button>
        <span class="text-muted" id="orders-page-info"></span>
        <button class="btn btn-secondary btn-sm" id="orders-next" onclick="changeOrderPage(1)">Next →</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!auth.requireAuth()) {}

    let currentStatus = '';
    let currentPage = 1;
    let showScheduledOnly = false;

    async function loadOrders() {
      try {
        let url = `/orders?page=${currentPage}&limit=10`;
        if (currentStatus) url += `&status=${currentStatus}`;
        if (showScheduledOnly) url += `&scheduled=true`;

        const data = await api.get(url);
        const el = document.getElementById('orders-list');

        if (data.data.length === 0) {
          el.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <h3 class="empty-state-title">No orders found</h3>
              <p class="empty-state-text">Start ordering to see your history here</p>
              <a href="/restaurants.html" class="btn btn-primary">Browse Restaurants →</a>
            </div>`;
          document.getElementById('orders-pagination').style.display = 'none';
          return;
        }

        el.innerHTML = data.data.map(order => `
          <div class="glass-card mb-3 fade-in" style="padding: 0; overflow: hidden; cursor: pointer;" onclick="location.href='/order-tracking.html?id=${order._id}'">
            <div style="display: flex; align-items: stretch;">
              <div style="width: 6px; background: ${getStatusGradient(order.status)};"></div>
              <div style="flex: 1; padding: 20px;">
                <div class="flex items-center justify-between mb-2">
                  <div>
                    <span style="font-weight: 700; font-size: 1rem;">Order #${order._id.slice(-8).toUpperCase()}</span>
                    <span class="status-badge ${getStatusColor(order.status)}" style="margin-left: 8px;">${order.status.replace(/_/g, ' ')}</span>
                    ${order.isScheduled ? `<span class="scheduled-badge" style="margin-left: 8px;">📅 Scheduled: ${new Date(order.scheduledFor).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>` : ''}
                  </div>
                  <div class="text-muted" style="font-size: 0.8rem;">${new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                </div>
                
                <div class="flex items-center gap-2 mb-2">
                  ${order.restaurant ? `<span style="font-size: 0.9rem;">🏪 ${order.restaurant.name}</span>` : ''}
                  <span class="text-muted" style="font-size: 0.85rem;">•</span>
                  <span style="font-size: 0.85rem; color: var(--text-secondary);">${order.items.length} item${order.items.length > 1 ? 's' : ''}</span>
                </div>

                <div class="flex items-center" style="gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                  ${order.items.slice(0, 3).map(i => `<span style="font-size: 0.8rem; padding: 3px 10px; background: var(--bg-glass); border-radius: var(--radius-full); color: var(--text-secondary);">${i.name} ×${i.quantity}</span>`).join('')}
                  ${order.items.length > 3 ? `<span class="text-muted" style="font-size: 0.8rem;">+${order.items.length - 3} more</span>` : ''}
                </div>

                <div class="flex items-center justify-between">
                  <div>
                    <span class="price" style="font-size: 1.1rem;">${formatPrice(order.totalPrice)}</span>
                    <span class="status-badge ${getStatusColor(order.paymentStatus)}" style="margin-left: 8px;">${order.paymentMethod === 'cod' ? '💵 COD' : '💳 ' + order.paymentStatus}</span>
                  </div>
                  <div class="flex gap-1">
                    <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); location.href='/order-tracking.html?id=${order._id}'">
                      📍 Track
                    </button>
                    ${order.status === 'delivered' ? `
                      <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); reorder('${order._id}')">
                        🔄 Reorder
                      </button>
                    ` : ''}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `).join('');

        // Pagination
        const pg = data.pagination;
        const pgEl = document.getElementById('orders-pagination');
        if (pg.pages > 1) {
          pgEl.style.display = 'flex';
          document.getElementById('orders-page-info').textContent = `Page ${pg.page} of ${pg.pages}`;
          document.getElementById('orders-prev').disabled = pg.page <= 1;
          document.getElementById('orders-next').disabled = pg.page >= pg.pages;
        } else {
          pgEl.style.display = 'none';
        }
      } catch (err) {
        showToast('Failed to load orders', 'error');
      }
    }

    function filterOrders(status, el) {
      currentStatus = status;
      currentPage = 1;
      showScheduledOnly = false;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      loadOrders();
    }

    function filterScheduled(el) {
      currentStatus = '';
      currentPage = 1;
      showScheduledOnly = true;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      loadOrders();
    }

    function changeOrderPage(dir) {
      currentPage += dir;
      loadOrders();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function reorder(orderId) {
      try {
        await api.post(`/orders/${orderId}/reorder`);
        showToast('Items added to cart! 🛒', 'success');
        window.location.href = '/cart.html';
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function getStatusGradient(status) {
      const gradients = {
        placed: 'var(--gradient-blue)',
        confirmed: 'var(--gradient-purple)',
        preparing: 'linear-gradient(to bottom, #f59e0b, #d97706)',
        out_for_delivery: 'var(--gradient-primary)',
        delivered: 'var(--gradient-green)',
        cancelled: 'linear-gradient(to bottom, #ef4444, #dc2626)',
      };
      return gradients[status] || 'var(--gradient-blue)';
    }

    loadOrders();
  </script>
</body>
</html>
