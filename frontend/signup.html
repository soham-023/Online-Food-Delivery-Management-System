<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — AnnSeva</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-content" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding-top: 0;">
    <div class="container" style="max-width: 440px;">
      <div class="glass-card fade-in" style="padding: 40px;">
        <div class="text-center mb-4">
          <div style="font-size: 3rem; margin-bottom: 8px;">🍔</div>
          <h1 style="font-size: 1.8rem;">Create Account</h1>
          <p class="text-muted">Join AnnSeva today!</p>
        </div>

        <form id="signup-form" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="signup-name" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="signup-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="signup-password" placeholder="Min 6 characters" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select class="form-input" id="signup-role">
              <option value="customer">🛒 Customer</option>
              <option value="restaurant">🏪 Restaurant Owner</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-3" id="signup-btn">
            Create Account →
          </button>
        </form>

        <p class="text-center mt-3 text-muted" style="font-size: 0.9rem;">
          Already have an account? <a href="/login.html">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (api.isLoggedIn()) window.location.href = '/index.html';

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Creating...';

      try {
        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const role = document.getElementById('signup-role').value;

        await auth.signup(name, email, password, role);
        showToast('Account created! Welcome! 🎉', 'success');
        setTimeout(() => window.location.href = '/index.html', 500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Create Account →';
      }
    }
  </script>
</body>
</html>
