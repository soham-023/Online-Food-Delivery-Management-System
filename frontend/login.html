<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AnnSeva</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-content" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding-top: 0;">
    <div class="container" style="max-width: 440px;">
      <div class="glass-card fade-in" style="padding: 40px;">
        <div class="text-center mb-4">
          <div style="font-size: 3rem; margin-bottom: 8px;">🍔</div>
          <h1 style="font-size: 1.8rem;">Welcome Back!</h1>
          <p class="text-muted">Login to your AnnSeva account</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="login-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-3" id="login-btn">
            Login →
          </button>
        </form>

        <p class="text-center mt-3 text-muted" style="font-size: 0.9rem;">
          Don't have an account? <a href="/signup.html">Sign Up</a>
        </p>

        <div class="mt-3" style="border-top: 1px solid var(--border-color); padding-top: 16px;">
          <p class="text-muted text-center mb-2" style="font-size: 0.8rem;">DEMO ACCOUNTS</p>
          <div class="flex flex-col gap-1" style="gap: 8px;">
            <button class="btn btn-secondary btn-sm btn-block" onclick="fillDemo('soham@gmail.com','user123')">👤 Customer</button>
            <button class="btn btn-secondary btn-sm btn-block" onclick="fillDemo('admin@annseva.com','admin123')">🔧 Admin</button>
            <button class="btn btn-secondary btn-sm btn-block" onclick="fillDemo('restaurant@annseva.com','rest123')">🏪 Restaurant</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (api.isLoggedIn()) window.location.href = '/index.html';

    function fillDemo(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Logging in...';

      try {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        await auth.login(email, password);
        showToast('Login successful! 🎉', 'success');
        
        const user = api.getUser();
        setTimeout(() => {
          if (user.role === 'admin') window.location.href = '/admin.html';
          else window.location.href = '/index.html';
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Login →';
      }
    }
  </script>
</body>
</html>
