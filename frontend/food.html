<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Details — AnnSeva</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-content">
    <div class="container">
      <div id="food-detail">
        <div class="loader"><div class="spinner"></div></div>
      </div>

      <div class="mt-4" id="food-reviews"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const itemId = new URLSearchParams(window.location.search).get('id');

    async function loadFoodDetail() {
      try {
        const data = await api.get(`/menu/${itemId}`);
        const item = data.data;
        document.title = `${item.name} — AnnSeva`;

        document.getElementById('food-detail').innerHTML = `
          <div class="glass-card fade-in" style="padding: 0; overflow: hidden;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0;">
              <div style="height: 400px; overflow: hidden;">
                <img src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;">
              </div>
              <div style="padding: 40px; display: flex; flex-direction: column; justify-content: center;">
                <div class="flex items-center gap-1 mb-2">
                  <span class="badge-tag ${item.isVeg ? 'badge-veg' : 'badge-nonveg'}">${item.isVeg ? '🟢 VEG' : '🔴 NON-VEG'}</span>
                  <span class="badge-tag badge-rating">⭐ ${item.rating} (${item.numReviews})</span>
                  <span class="badge-tag" style="background: rgba(255,255,255,0.05); color: var(--text-secondary);">${item.category}</span>
                </div>
                <h1 style="font-size: 2rem; margin-bottom: 12px;">${item.name}</h1>
                <p class="text-muted mb-3" style="line-height: 1.7;">${item.description}</p>
                ${item.restaurant ? `<p class="mb-2">From: <a href="/restaurant.html?id=${item.restaurant._id}" style="font-weight: 600;">${item.restaurant.name}</a></p>` : ''}
                <div class="price price-lg mb-3">${formatPrice(item.price)}</div>
                <div class="flex items-center gap-2">
                  <div class="qty-control">
                    <button class="qty-btn" onclick="changeQty(-1)">−</button>
                    <span class="qty-value" id="food-qty">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                  </div>
                  <button class="btn btn-primary btn-lg" onclick="addFoodToCart()" style="flex: 1;">
                    🛒 Add to Cart — <span id="total-price">${formatPrice(item.price)}</span>
                  </button>
                </div>
                <button class="btn btn-secondary mt-2" onclick="toggleWishlistItem()">
                  ❤️ Add to Wishlist
                </button>
              </div>
            </div>
          </div>
        `;

        // Store price
        window.foodItem = item;
        loadFoodReviews();
      } catch {
        document.getElementById('food-detail').innerHTML = '<div class="empty-state"><h3>Item not found</h3></div>';
      }
    }

    function changeQty(delta) {
      const el = document.getElementById('food-qty');
      let qty = parseInt(el.textContent) + delta;
      if (qty < 1) qty = 1;
      if (qty > 20) qty = 20;
      el.textContent = qty;
      document.getElementById('total-price').textContent = formatPrice(window.foodItem.price * qty);
    }

    async function addFoodToCart() {
      if (!auth.requireAuth()) return;
      const qty = parseInt(document.getElementById('food-qty').textContent);
      try {
        await api.post('/cart', { menuItemId: itemId, quantity: qty });
        showToast(`Added ${qty}x ${window.foodItem.name} to cart! 🛒`, 'success');
        updateCartBadge();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function toggleWishlistItem() {
      if (!auth.requireAuth()) return;
      try {
        const data = await api.post(`/wishlist/item/${itemId}`);
        showToast(data.added ? 'Added to wishlist! ❤️' : 'Removed from wishlist', data.added ? 'success' : 'info');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function loadFoodReviews() {
      try {
        const data = await api.get(`/reviews/food/${itemId}`);
        if (data.data.length === 0) return;
        document.getElementById('food-reviews').innerHTML = `
          <h2 class="section-title mb-3">Reviews</h2>
          ${data.data.map(r => `
            <div class="glass-card mb-2" style="padding: 16px;">
              <div class="flex items-center justify-between">
                <strong>${r.user?.name || 'User'}</strong>
                <span class="badge-tag badge-rating">⭐ ${r.rating}</span>
              </div>
              ${r.comment ? `<p class="text-muted mt-1" style="font-size: 0.9rem;">${r.comment}</p>` : ''}
            </div>
          `).join('')}
        `;
      } catch {}
    }

    if (itemId) loadFoodDetail();
    else window.location.href = '/restaurants.html';
  </script>
  <style>
    @media (max-width: 768px) {
      #food-detail .glass-card > div { grid-template-columns: 1fr !important; }
      #food-detail .glass-card > div > div:first-child { height: 250px !important; }
    }
  </style>
</body>
</html>
