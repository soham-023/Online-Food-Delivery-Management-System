<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — AnnSeva</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-content">
    <div class="container" style="max-width: 800px;">
      <h1 class="section-title fade-in">My Profile 👤</h1>
      <p class="section-subtitle mb-3 fade-in">Manage your account</p>

      <!-- Profile Info -->
      <div class="glass-card mb-3 fade-in stagger-1">
        <div class="flex items-center gap-2 mb-3">
          <div class="nav-avatar" style="width: 64px; height: 64px; font-size: 1.5rem;" id="profile-avatar">?</div>
          <div>
            <h2 id="profile-name" style="font-size: 1.3rem;">Loading...</h2>
            <p class="text-muted" id="profile-email">...</p>
            <span class="badge-tag badge-status" id="profile-role">customer</span>
          </div>
        </div>

        <form onsubmit="updateProfile(event)">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-input" id="edit-name" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="edit-email" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-input" id="edit-phone" placeholder="9876543210">
          </div>
          <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
        </form>
      </div>

      <!-- Change Password -->
      <div class="glass-card mb-3 fade-in stagger-2">
        <h3 class="mb-2">🔒 Change Password</h3>
        <form onsubmit="changePassword(event)">
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-input" id="current-pass" required>
          </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" class="form-input" id="new-pass" minlength="6" required>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-input" id="confirm-pass" minlength="6" required>
            </div>
          </div>
          <button type="submit" class="btn btn-secondary">Update Password</button>
        </form>
      </div>

      <!-- Saved Addresses -->
      <div class="glass-card fade-in stagger-3">
        <div class="flex items-center justify-between mb-2">
          <h3>📍 Saved Addresses</h3>
          <button class="btn btn-secondary btn-sm" onclick="toggleAddressForm()">+ Add New</button>
        </div>

        <div id="addresses-list"></div>

        <div id="new-address-form" style="display: none;" class="mt-3" style="border-top: 1px solid var(--border-color); padding-top: 20px;">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Label</label>
              <select class="form-input" id="new-addr-label">
                <option value="Home">🏠 Home</option>
                <option value="Work">🏢 Work</option>
                <option value="Other">📍 Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-input" id="new-addr-phone" placeholder="9876543210">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Street</label>
            <input type="text" class="form-input" id="new-addr-street" placeholder="123 MG Road">
          </div>
          <div class="grid grid-3">
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" class="form-input" id="new-addr-city" placeholder="Pune">
            </div>
            <div class="form-group">
              <label class="form-label">State</label>
              <input type="text" class="form-input" id="new-addr-state" placeholder="Maharashtra">
            </div>
            <div class="form-group">
              <label class="form-label">Pincode</label>
              <input type="text" class="form-input" id="new-addr-pincode" placeholder="411001">
            </div>
          </div>
          <button class="btn btn-success btn-sm" onclick="addAddress()">Save Address</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!auth.requireAuth()) {}

    async function loadProfile() {
      try {
        const user = await auth.getProfile();
        document.getElementById('profile-avatar').textContent = user.name.charAt(0).toUpperCase();
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-role').textContent = user.role;
        document.getElementById('edit-name').value = user.name;
        document.getElementById('edit-email').value = user.email;
        document.getElementById('edit-phone').value = user.phone || '';
        renderAddresses(user.addresses || []);
      } catch (err) { showToast('Failed to load profile', 'error'); }
    }

    async function updateProfile(e) {
      e.preventDefault();
      try {
        await api.put('/users/profile', {
          name: document.getElementById('edit-name').value,
          email: document.getElementById('edit-email').value,
          phone: document.getElementById('edit-phone').value,
        });
        showToast('Profile updated! ✅', 'success');
        loadProfile();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function changePassword(e) {
      e.preventDefault();
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('confirm-pass').value;
      if (newPass !== confirmPass) return showToast('Passwords do not match', 'error');

      try {
        await api.put('/users/password', {
          currentPassword: document.getElementById('current-pass').value,
          newPassword: newPass,
        });
        showToast('Password changed! 🔒', 'success');
        document.getElementById('current-pass').value = '';
        document.getElementById('new-pass').value = '';
        document.getElementById('confirm-pass').value = '';
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAddresses(addresses) {
      const el = document.getElementById('addresses-list');
      if (addresses.length === 0) {
        el.innerHTML = '<p class="text-muted">No saved addresses</p>';
        return;
      }
      el.innerHTML = addresses.map(a => `
        <div class="flex items-center justify-between" style="padding: 14px; background: var(--bg-glass); border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border-color);">
          <div>
            <div style="font-weight: 600;">${a.label} ${a.isDefault ? '⭐ Default' : ''}</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">${a.street}, ${a.city}, ${a.state} - ${a.pincode}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">📞 ${a.phone}</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="deleteAddress('${a._id}')">🗑️</button>
        </div>
      `).join('');
    }

    function toggleAddressForm() {
      const f = document.getElementById('new-address-form');
      f.style.display = f.style.display === 'none' ? 'block' : 'none';
    }

    async function addAddress() {
      try {
        await api.post('/users/address', {
          label: document.getElementById('new-addr-label').value,
          phone: document.getElementById('new-addr-phone').value,
          street: document.getElementById('new-addr-street').value,
          city: document.getElementById('new-addr-city').value,
          state: document.getElementById('new-addr-state').value,
          pincode: document.getElementById('new-addr-pincode').value,
        });
        showToast('Address added! 📍', 'success');
        document.getElementById('new-address-form').style.display = 'none';
        loadProfile();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteAddress(id) {
      if (!confirm('Delete this address?')) return;
      try {
        await api.delete(`/users/address/${id}`);
        showToast('Address removed', 'info');
        loadProfile();
      } catch (err) { showToast(err.message, 'error'); }
    }

    loadProfile();
  </script>
</body>
</html>
