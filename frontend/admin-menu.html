<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Menu — AnnSeva Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-content">
    <div class="container">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="section-title">Manage Menu 🍕</h1>
          <div class="flex gap-2 mt-2">
            <a href="/admin.html" class="btn btn-secondary btn-sm">← Dashboard</a>
            <a href="/admin-restaurants.html" class="btn btn-secondary btn-sm">🏪 Restaurants</a>
          </div>
        </div>
        <button class="btn btn-primary" onclick="showMenuModal()">+ Add Item</button>
      </div>

      <!-- Restaurant Filter -->
      <div class="flex gap-2 mb-3" style="flex-wrap: wrap;">
        <select class="form-input" id="filter-restaurant" style="width: auto; min-width: 200px;" onchange="loadMenuItems()">
          <option value="">All Restaurants</option>
        </select>
        <select class="form-input" id="filter-category" style="width: auto;" onchange="loadMenuItems()">
          <option value="">All Categories</option>
          <option value="starters">Starters</option>
          <option value="main-course">Main Course</option>
          <option value="desserts">Desserts</option>
          <option value="beverages">Beverages</option>
          <option value="snacks">Snacks</option>
          <option value="biryani">Biryani</option>
          <option value="pizza">Pizza</option>
          <option value="burger">Burger</option>
          <option value="chinese">Chinese</option>
          <option value="south-indian">South Indian</option>
          <option value="north-indian">North Indian</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Veg</th><th>Rating</th><th>Available</th><th>Actions</th></tr>
          </thead>
          <tbody id="menu-table"></tbody>
        </table>
      </div>

      <!-- Add/Edit Modal -->
      <div class="modal-overlay" id="menu-modal" style="display: none;">
        <div class="modal" style="max-width: 550px;">
          <div class="modal-header">
            <h3 class="modal-title" id="menu-modal-title">Add Menu Item</h3>
            <button class="modal-close" onclick="closeMenuModal()">✕</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="menu-edit-id">
            <div class="form-group"><label class="form-label">Restaurant</label><select class="form-input" id="menu-restaurant" required></select></div>
            <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="menu-name" required></div>
            <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="menu-desc"></textarea></div>
            <div class="grid grid-2">
              <div class="form-group"><label class="form-label">Price (₹)</label><input type="number" class="form-input" id="menu-price" min="0" required></div>
              <div class="form-group"><label class="form-label">Category</label>
                <select class="form-input" id="menu-category">
                  <option value="starters">Starters</option><option value="main-course">Main Course</option><option value="desserts">Desserts</option>
                  <option value="beverages">Beverages</option><option value="snacks">Snacks</option><option value="biryani">Biryani</option>
                  <option value="pizza">Pizza</option><option value="burger">Burger</option><option value="chinese">Chinese</option>
                  <option value="south-indian">South Indian</option><option value="north-indian">North Indian</option><option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="grid grid-2">
              <label class="filter-checkbox"><input type="checkbox" id="menu-veg"> 🟢 Vegetarian</label>
              <label class="filter-checkbox"><input type="checkbox" id="menu-available" checked> ✅ Available</label>
            </div>
            <div class="form-group mt-2"><label class="form-label">Image URL</label><input type="text" class="form-input" id="menu-image" placeholder="https://..."></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeMenuModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveMenuItem()">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!auth.requireAuth()) {}
    const user = api.getUser();
    if (user && user.role !== 'admin' && user.role !== 'restaurant') {
      showToast('Access denied', 'error');
      window.location.href = '/index.html';
    }
    if (user && user.role === 'restaurant') {
      const usersLink = document.querySelector('a[href="/admin-users.html"]');
      if (usersLink) usersLink.style.display = 'none';
      
      const restLink = document.querySelector('a[href="/admin-restaurants.html"]');
      if (restLink) restLink.textContent = '🏪 My Restaurant';
    }

    const preselectedRest = new URLSearchParams(window.location.search).get('restaurant');

    async function loadRestaurantOptions() {
      try {
        const data = await api.get('/restaurants?limit=100');
        const options = data.data.map(r => `<option value="${r._id}" ${preselectedRest === r._id ? 'selected' : ''}>${r.name}</option>`).join('');
        document.getElementById('filter-restaurant').innerHTML = '<option value="">All Restaurants</option>' + options;
        document.getElementById('menu-restaurant').innerHTML = options;
        if (preselectedRest) loadMenuItems();
      } catch {}
    }

    async function loadMenuItems() {
      const restId = document.getElementById('filter-restaurant').value || preselectedRest;
      const category = document.getElementById('filter-category').value;

      if (!restId) {
        document.getElementById('menu-table').innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding: 30px;">Select a restaurant to view menu</td></tr>';
        return;
      }

      try {
        let url = `/menu/restaurant/${restId}?limit=100`;
        if (category) url += `&category=${category}`;

        const data = await api.get(url);
        const el = document.getElementById('menu-table');

        if (data.data.length === 0) {
          el.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding: 30px;">No items found</td></tr>';
          return;
        }

        el.innerHTML = data.data.map(item => `
          <tr>
            <td><img src="${item.image || ''}" alt="" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover;"></td>
            <td><strong>${item.name}</strong></td>
            <td><span class="badge-tag" style="background: var(--bg-glass);">${item.category}</span></td>
            <td class="price">${formatPrice(item.price)}</td>
            <td>${item.isVeg ? '🟢' : '🔴'}</td>
            <td>⭐ ${item.rating}</td>
            <td>${item.isAvailable ? '<span class="text-green">Yes</span>' : '<span class="text-red">No</span>'}</td>
            <td>
              <div class="flex gap-1">
                <button class="btn btn-secondary btn-sm" onclick='editMenuItem(${JSON.stringify(item)})'>✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteMenuItem('${item._id}')">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function showMenuModal() {
      document.getElementById('menu-modal').style.display = 'flex';
      document.getElementById('menu-modal-title').textContent = 'Add Menu Item';
      document.getElementById('menu-edit-id').value = '';
      document.getElementById('menu-name').value = '';
      document.getElementById('menu-desc').value = '';
      document.getElementById('menu-price').value = '';
      document.getElementById('menu-image').value = '';
      document.getElementById('menu-veg').checked = false;
      document.getElementById('menu-available').checked = true;
    }

    function closeMenuModal() { document.getElementById('menu-modal').style.display = 'none'; }

    function editMenuItem(item) {
      document.getElementById('menu-modal').style.display = 'flex';
      document.getElementById('menu-modal-title').textContent = 'Edit Menu Item';
      document.getElementById('menu-edit-id').value = item._id;
      document.getElementById('menu-restaurant').value = item.restaurant?._id || item.restaurant;
      document.getElementById('menu-name').value = item.name;
      document.getElementById('menu-desc').value = item.description;
      document.getElementById('menu-price').value = item.price;
      document.getElementById('menu-category').value = item.category;
      document.getElementById('menu-veg').checked = item.isVeg;
      document.getElementById('menu-available').checked = item.isAvailable;
      document.getElementById('menu-image').value = item.image;
    }

    async function saveMenuItem() {
      const id = document.getElementById('menu-edit-id').value;
      const body = {
        restaurant: document.getElementById('menu-restaurant').value,
        name: document.getElementById('menu-name').value,
        description: document.getElementById('menu-desc').value,
        price: Number(document.getElementById('menu-price').value),
        category: document.getElementById('menu-category').value,
        isVeg: document.getElementById('menu-veg').checked,
        isAvailable: document.getElementById('menu-available').checked,
        image: document.getElementById('menu-image').value,
      };
      try {
        if (id) { await api.put(`/menu/${id}`, body); }
        else { await api.post('/menu', body); }
        showToast(id ? 'Item updated!' : 'Item created! 🍕', 'success');
        closeMenuModal();
        loadMenuItems();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteMenuItem(id) {
      if (!confirm('Delete this item?')) return;
      try { await api.delete(`/menu/${id}`); showToast('Deleted', 'info'); loadMenuItems(); }
      catch (err) { showToast(err.message, 'error'); }
    }

    loadRestaurantOptions();
    loadMenuItems();
  </script>
</body>
</html>
